<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CICG Screen</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      var r = new URLSearchParams(location.search).get("r");
      if (!r) return;
      var link = document.querySelector("link[rel='stylesheet']");
      if (link) link.href = "css/styles.css?r=" + encodeURIComponent(r);
    })();
  </script>
</head>
<body>
  <div class="stage" id="stage">
    <div class="split">
      <section class="panel-left">
        <img class="logo" src="images/hsh-logo.png" alt="Hope Starts Here">
        <div class="welcome-block">
          <p class="welcome">Welcome test</p>
          <p class="practical">Thursday 5 November 2026<br>CICG, Geneva</p>
        </div>
        <img class="organizer" src="images/ecw-logo.png" alt="Education Cannot Wait">
      </section>

      <section class="panel-right">
        <canvas class="globe" id="globe" aria-hidden="true"></canvas>
        <div class="topbar">
          <div class="box">
            <div class="stats">
              <p class="box-label">Total children reached: <strong>16.1 Million</strong></p>
              <div class="share" aria-label="50% girls, 50% male">
                <div class="share-bar">
                  <span class="share-girls"></span>
                  <span class="share-male"></span>
                </div>
                <p class="share-key">
                  <span><i class="swatch swatch-girls"></i>50% girls</span>
                  <span><i class="swatch swatch-male"></i>50% male</span>
                </p>
              </div>
            </div>
          </div>
          <div class="box box-countries">
            <p class="box-label">Reached Countries</p>
            <p class="box-count">44</p>
          </div>
          <aside class="box popup" id="popup">
            <div class="popup-country" id="popup-country" hidden>
              <p class="box-label">Children reached by ECW <strong><span id="popup-name">Ukraine</span>: <span id="popup-value">4.3 M</span></strong></p>
            </div>
            <div class="popup-gap" id="popup-gap">
              <p class="gap-line"><strong>258M</strong> children &amp; adolescents affected</p>
              <p class="gap-line"><strong>93M</strong> completely out of school</p>
              <p class="gap-line gap-line-wide"><strong>$600M</strong> replenishment ask</p>
            </div>
          </aside>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      var r = new URLSearchParams(location.search).get("r");
      var q = r ? "?r=" + encodeURIComponent(r) : "";
      document.write('<script src="data/countries-110m.js' + q + '"><\/script>');
      document.write('<script src="js/globe.js' + q + '"><\/script>');
      document.write('<script src="js/refresh.js' + q + '"><\/script>');
    })();
  </script>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var width = 1920;
      var height = 1080;

      function fit() {
        var scale = Math.min(window.innerWidth / width, window.innerHeight / height);
        var x = (window.innerWidth - width * scale) / 2;
        var y = (window.innerHeight - height * scale) / 2;
        stage.style.transform = "translate(" + x + "px, " + y + "px) scale(" + scale + ")";
        var left = (x / window.innerWidth) * 100;
        var right = ((x + width * scale) / window.innerWidth) * 100;
        var gradient = "linear-gradient(90deg, #ffffff 0%, #ffffff " + left + "%, #002d44 " + right + "%, #002d44 100%)";
        document.documentElement.style.background = gradient;
        document.body.style.background = gradient;
        window.dispatchEvent(new Event("stage-fit"));
      }

      var rev = new URLSearchParams(location.search).get("r");
      if (rev) {
        document.querySelectorAll("img").forEach(function (img) {
          img.src = img.getAttribute("src").split("?")[0] + "?r=" + encodeURIComponent(rev);
        });
      }

      window.addEventListener("resize", fit);
      fit();
    })();
  </script>
</body>
</html>
