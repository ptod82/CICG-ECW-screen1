<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CICG Screen</title>
  <style>
    :root {
      --stage-width: 1920px;
      --stage-height: 1080px;
      /* 5% action-safe inset so venue TVs do not crop the edges. */
      --safe-x: 96px;
      --safe-y: 54px;
      --bg: #070b12;
      --surface: #121a27;
      --line: rgba(255, 255, 255, 0.14);
      --text: #f4f7fb;
      --muted: #9aa8bc;
      --accent: #3db7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /*
      Authored at 1920×1080. The script scales this stage to fit
      720p, 1080p, 4K, and any other 16:9 or non-16:9 TV.
    */
    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--stage-width);
      height: var(--stage-height);
      transform-origin: 0 0;
      background:
        radial-gradient(1200px 700px at 80% -10%, rgba(61, 183, 255, 0.16), transparent 60%),
        var(--surface);
    }

    .safe {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: var(--safe-y) var(--safe-x);
      gap: 32px;
    }

    .screen-header,
    .screen-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 72px;
      line-height: 1.05;
      font-weight: 650;
    }

    .screen-main {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 32px;
    }

    .panel {
      min-height: 0;
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.03);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 40px;
      line-height: 1.15;
      font-weight: 650;
    }

    p {
      margin: 0;
      max-width: 36ch;
      color: var(--muted);
      font-size: 32px;
      line-height: 1.35;
    }

    .screen-footer {
      color: var(--muted);
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="safe">
      <header class="screen-header">
        <div>
          <p class="kicker">Hope Starts Here</p>
          <h1>Education cannot wait</h1>
        </div>
      </header>

      <main class="screen-main">
        <section class="panel">
          <h2>Replenishment campaign</h2>
          <p>Lorem ipsum</p>
        </section>
        <section class="panel">
          <h2>Programme</h2>
          <p>Dolor sit amet.</p>
        </section>
      </main>

      <footer class="screen-footer">
        <span>Footer</span>
      </footer>
    </div>
  </div>

  <script>
    (function () {
      var stage = document.getElementById("stage");
      var width = 1920;
      var height = 1080;

      function fit() {
        var scale = Math.min(window.innerWidth / width, window.innerHeight / height);
        var x = (window.innerWidth - width * scale) / 2;
        var y = (window.innerHeight - height * scale) / 2;
        stage.style.transform = "translate(" + x + "px, " + y + "px) scale(" + scale + ")";
      }

      window.addEventListener("resize", fit);
      fit();
    })();
  </script>
</body>
</html>
